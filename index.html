<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TripLedger</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TripLedger"><meta name="theme-color" content="#0f766e"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f3;--card:#fff;--ink:#14262b;--mut:#5d7078;--line:#dbe3e6;--acc:#0f766e;--accfg:#fff;--upi:#0f766e;--cash:#d97706;--debit:#2563eb;--credit:#9333ea;--oth:#64748b;--danger:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1719;--card:#162427;--ink:#e8f0f1;--mut:#97aab0;--line:#26393d;--acc:#2dd4bf;--accfg:#06201d;--danger:#f87171}}
:root[data-theme="dark"]{--bg:#0d1719;--card:#162427;--ink:#e8f0f1;--mut:#97aab0;--line:#26393d;--acc:#2dd4bf;--accfg:#06201d;--danger:#f87171}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 'DM Sans',system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 110px}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
h1{font-size:26px}h2{font-size:19px;margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.hero{background:var(--acc);color:var(--accfg);border-radius:20px;padding:20px;margin-bottom:12px}
.hero .big{font:700 40px 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums}
.muted{color:var(--mut);font-size:13px}.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;font:700 20px 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums}
button,.btn{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--acc);color:var(--accfg);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.sm{padding:6px 10px;font-size:13px}button.dng{background:transparent;color:var(--danger)}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav .in{display:flex;max-width:520px;width:100%}nav button{flex:1;background:none;color:var(--mut);padding:8px 4px;font-size:12px;border-radius:10px}nav button.on{color:var(--acc)}nav svg{display:block;margin:0 auto 2px}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 6px 16px rgba(0,0,0,.28);z-index:5}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px}.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.amt{font-weight:600;font-variant-numeric:tabular-nums}.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td.r,th.r{text-align:right}
.rep{background:#fff;color:#111;padding:20px;border-radius:12px}.rep h2{color:#0f766e;border-bottom:2px solid #0f766e;padding-bottom:6px}.rep td,.rep th{border-color:#ddd}
.rep img{max-width:100%;max-height:260px;border:1px solid #ddd;margin:6px 6px 0 0}
@media print{body>#app>*:not(#rep),nav,.fab,.noprint{display:none!important}.sheet{position:static;background:none}.sheet>div{max-height:none;padding:0}}
</style></head><body><div id="app"></div>
<script>
const MODES=['UPI','Cash','Debit Card','Credit Card','Other'],MC={'UPI':'var(--upi)','Cash':'var(--cash)','Debit Card':'var(--debit)','Credit Card':'var(--credit)','Other':'var(--oth)'};
const CATS={Food:/coffee|tea|lunch|dinner|breakfast|snack|food|meal|cafe/i,Transport:/taxi|cab|uber|ola|fuel|petrol|parking|toll|train|flight|bus|metro|auto/i,Stay:/hotel|room|stay|lodge/i};
const cat=d=>{for(const k in CATS)if(CATS[k].test(d))return k;return'Other'};
const inr=n=>'₹'+(+n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
let S={trips:[],exp:[],profile:{name:'',company:'',empId:'',dept:''},theme:'auto',tripId:null};
try{const x=localStorage.getItem('tl1');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
let tab='home',view=null,flt={mode:'All',q:'',date:''},toast='';
const save=()=>{try{localStorage.setItem('tl1',JSON.stringify(S))}catch(e){note('Storage is full. Back up your data and delete some receipts.')}};
const uid=()=>Math.random().toString(36).slice(2,10);
const BANKS=['HDFC Bank','ICICI Bank','State Bank of India (SBI)','Axis Bank','Kotak Mahindra Bank','Punjab National Bank (PNB)','Bank of Baroda','IDFC FIRST Bank','IndusInd Bank','Yes Bank','Federal Bank','Other'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const EMB=(()=>{try{return window.self!==window.top}catch(e){return true}})();
function note(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#14262b;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;max-width:85%;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
function ask(m,yes){const d=sheet(`<p>${esc(m)}</p><div class="row"><button class="ghost grow" id="no">Cancel</button><button class="grow" id="ok">Confirm</button></div>`);d.querySelector('#no').onclick=()=>d.remove();d.querySelector('#ok').onclick=()=>{d.remove();yes()}}
function getFile(name,text,type){if(EMB)return false;try{const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return true}catch(e){return false}}
function showText(title,txt){const d=sheet(`<h2 style="margin-top:0">${title}</h2><p class="muted">Select all, then copy.</p><textarea id="tx" rows="10"></textarea><button id="x" style="width:100%;margin-top:10px">Close</button>`);const t=d.querySelector('#tx');t.value=txt;t.select();d.querySelector('#x').onclick=()=>d.remove()}
async function copyText(txt,title){try{await navigator.clipboard.writeText(txt);note('Copied')}catch(e){showText(title,txt)}}
async function makePDF(t,l,m){
if(EMB){note('PDF saving only works in your Netlify app, not inside Claude.');return}
if(!window.jspdf){note('PDF tool did not load. Check your internet and reopen the app.');return}
note('Preparing PDF...');await new Promise(r=>setTimeout(r,50));
try{const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),p=S.profile,W=210,R=n=>'Rs. '+(+n||0).toLocaleString('en-IN',{maximumFractionDigits:2});let y=18;
const chk=h=>{if(y+h>285){doc.addPage();y=18}},B=()=>doc.setFont('helvetica','bold'),N=()=>doc.setFont('helvetica','normal'),H=s=>{chk(14);B();doc.setFontSize(13);doc.setTextColor(15,118,110);doc.text(s,14,y);y+=7;doc.setTextColor(30);doc.setFontSize(10)};
B();doc.setFontSize(18);doc.setTextColor(15,118,110);doc.text('Expense Report',14,y);y+=3;doc.setDrawColor(15,118,110);doc.line(14,y,W-14,y);y+=8;doc.setFontSize(10);doc.setTextColor(30);
[['Employee',(p.name||'')+(p.empId?' ('+p.empId+')':'')],['Company / Dept',[p.company,p.dept].filter(Boolean).join(' / ')],['Trip',t.name],['Location',t.loc],['Dates',(t.s||'')+' to '+(t.e||'')]].forEach(([a,b])=>{B();doc.text(a,14,y);N();doc.text(String(b||'-'),50,y);y+=6});
y+=4;H('Transactions');
const hd=()=>{B();doc.setFontSize(9);doc.text('#',14,y);doc.text('Date',22,y);doc.text('Description',52,y);doc.text('Mode',122,y);doc.text('Amount',W-14,y,{align:'right'});y+=2;doc.setDrawColor(180);doc.line(14,y,W-14,y);y+=5;N()};hd();
l.forEach((e,i)=>{const ds=doc.splitTextToSize(e.desc+(e.imgs&&e.imgs.length?' ('+e.imgs.length+' receipt'+(e.imgs.length>1?'s':'')+')':''),66),ms=doc.splitTextToSize(e.mode+(e.bank?' ('+e.bank+')':''),48),h=Math.max(ds.length,ms.length)*4.5+2;if(y+h>285){doc.addPage();y=18;hd()}doc.setFontSize(9);doc.text(String(i+1),14,y);doc.text(new Date(e.at).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'}),22,y);doc.text(ds,52,y);doc.text(ms,122,y);doc.text(R(e.amt),W-14,y,{align:'right'});y+=h});
y+=4;H('Summary');m.forEach(x=>{chk(7);N();doc.text('Total '+x.k,14,y);doc.text(R(x.v),W-14,y,{align:'right'});y+=6});chk(9);doc.line(14,y-3,W-14,y-3);B();doc.text('Overall trip expenditure',14,y+2);doc.text(R(sum(l)),W-14,y+2,{align:'right'});y+=10;
const rc=l.map((e,i)=>({e,i})).filter(x=>x.e.imgs&&x.e.imgs.length);
if(rc.length){doc.addPage();y=18;H('Receipts');for(const {e,i} of rc){for(const s of e.imgs){let w=80,h=80;try{const ip=doc.getImageProperties(s);const k=Math.min(80/ip.width,110/ip.height);w=ip.width*k;h=ip.height*k}catch(_){}chk(h+12);B();doc.setFontSize(9);doc.text('#'+(i+1)+' '+e.desc+' - '+R(e.amt),14,y);y+=3;try{doc.addImage(s,'JPEG',14,y,w,h)}catch(_){}y+=h+8}}}
const n=(t.name||'trip').replace(/\W+/g,'-')+'-expense-report.pdf',f=new File([doc.output('blob')],n,{type:'application/pdf'});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Expense report'});return}catch(e){if(e.name==='AbortError')return}}
doc.save(n);note('PDF saved')}catch(e){note('Could not create the PDF.')}}
function wipe(){const d=sheet(`<h2 style="margin-top:0;color:var(--danger)">Delete all data</h2><p>This permanently deletes all trips, expenses and payment screenshots on this device. It cannot be undone. Back up first if you may need them later.</p><label>Enter PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" style="letter-spacing:6px;font-size:22px;text-align:center"><p id="pe" style="color:var(--danger);min-height:20px;margin:6px 0"></p><div class="row"><button class="ghost grow" id="no">Cancel</button><button class="grow" id="go" style="background:var(--danger);color:#fff">Continue</button></div>`);
d.querySelector('#no').onclick=()=>d.remove();
d.querySelector('#go').onclick=()=>{if(d.querySelector('#pin').value!=='123'){d.querySelector('#pe').textContent='Incorrect PIN. Nothing was deleted.';return}d.remove();ask('Final confirmation: permanently delete ALL trips, expenses and receipts?',()=>{const keep={...S,trips:[],exp:[],tripId:null};try{localStorage.setItem('tl1',JSON.stringify(keep))}catch(e){note('Could not delete. Nothing was changed.');return}S=keep;view=null;tab='home';flt={mode:'All',q:'',date:''};render();note('All data has been successfully deleted.')})};
setTimeout(()=>d.querySelector('#pin').focus(),50)}
async function backup(){const j=JSON.stringify(S),n='tripledger-backup-'+new Date().toISOString().slice(0,10)+'.json';try{const f=new File([j],n,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}if(!getFile(n,j,'application/json'))showText('Backup',j);else note('Backup saved')}
function theme(){const r=document.documentElement;S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme)}
const active=()=>S.trips.find(t=>t.id===S.tripId&&!t.done)||S.trips.find(t=>!t.done);
const tx=id=>S.exp.filter(e=>e.trip===id);
const sum=l=>l.reduce((a,e)=>a+ +e.amt,0);
const bymode=l=>MODES.map(m=>({k:m,v:sum(l.filter(e=>e.mode===m))}));
const bycat=l=>{const o={};l.forEach(e=>{const c=cat(e.desc);o[c]=(o[c]||0)+ +e.amt});return Object.entries(o).map(([k,v])=>({k,v}))};
const ico=p=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={home:'<path d="M3 11l9-8 9 8v10H3z"/>',trips:'<path d="M4 7h16v13H4zM9 7V4h6v3"/>',rep:'<path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
function bars(list){const t=sum(list.map(x=>({amt:x.v})))||1;return list.filter(x=>x.v>0).map(x=>`<div style="margin:8px 0"><div class="row sp"><span><i class="dot" style="background:${MC[x.k]||'var(--acc)'}"></i> ${esc(x.k)}</span><span class="amt">${inr(x.v)}</span></div><div class="bar"><i style="width:${x.v/t*100}%;background:${MC[x.k]||'var(--acc)'}"></i></div></div>`).join('')||'<p class="muted">Nothing to show yet.</p>'}
function expRow(e,edit){const th=(e.imgs||[]).map((s,i)=>`<img src="${s}" data-e="${e.id}" data-i="${i}" alt="Receipt ${i+1}">`).join('');
return `<div class="card"><div class="row sp"><div class="grow"><b>${esc(e.desc)}</b><div class="muted">${new Date(e.at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}${e.loc?' · '+esc(e.loc):''}</div></div><div style="text-align:right"><div class="amt">${inr(e.amt)}</div><span class="tag" style="color:${MC[e.mode]}">${e.mode}${e.bank?' · '+esc(e.bank):''}</span></div></div>${e.note?`<div class="muted" style="margin-top:6px">${esc(e.note)}</div>`:''}${th?`<div class="thumbs">${th}</div>`:''}${edit?`<div class="row" style="margin-top:8px"><button class="ghost sm" data-act="editx" data-id="${e.id}">Edit</button><button class="dng sm" data-act="delx" data-id="${e.id}">Delete</button></div>`:''}</div>`}
function home(){const t=active();if(!t)return`<h1>TripLedger</h1><p class="muted">Record every payment as it happens. Report it in one tap.</p><div class="card"><b>Start your first trip</b><p class="muted">Create a trip, then add expenses with the + button.</p><button data-act="newtrip">New trip</button></div>`;
const l=tx(t.id),m=bymode(l),c=m.find(x=>x.k==='Debit Card').v+m.find(x=>x.k==='Credit Card').v;
return`<div class="muted">Hi${S.profile.name?', '+esc(S.profile.name):''}</div><h1>${esc(t.name)}</h1><div class="muted">${esc(t.loc)} · ${t.s||''} → ${t.e||''}</div>
<div class="hero" style="margin-top:12px"><div style="opacity:.8">Total trip expenses</div><div class="big">${inr(sum(l))}</div><div style="opacity:.8">${l.length} transaction${l.length==1?'':'s'}</div></div>
<div class="grid"><div class="card stat"><span class="muted">UPI</span><b>${inr(m[0].v)}</b></div><div class="card stat"><span class="muted">Cash</span><b>${inr(m[1].v)}</b></div><div class="card stat"><span class="muted">Cards</span><b>${inr(c)}</b></div><div class="card stat"><span class="muted">Other</span><b>${inr(m[4].v)}</b></div></div>
<h2>By payment method</h2><div class="card">${bars(m)}</div><h2>By category</h2><div class="card">${bars(bycat(l))}</div>
<div class="row sp"><h2>Recent</h2><button class="ghost sm" data-act="open" data-id="${t.id}">See all</button></div>${l.slice().sort((a,b)=>b.at-a.at).slice(0,3).map(e=>expRow(e)).join('')||'<p class="muted">No expenses yet. Tap + to add the first one.</p>'}
<button class="ghost" data-act="rep" data-id="${t.id}" style="width:100%;margin-top:6px">Generate report</button>`}
function trips(){const a=S.trips.filter(t=>!t.done),d=S.trips.filter(t=>t.done),mx=Math.max(1,...S.trips.map(t=>sum(tx(t.id))));
const r=t=>`<div class="card" data-act="open" data-id="${t.id}" style="cursor:pointer"><div class="row sp"><div class="grow"><b>${esc(t.name)}</b><div class="muted">${esc(t.loc)} · ${t.s||''}</div></div><span class="amt">${inr(sum(tx(t.id)))}</span></div></div>`;
return`<div class="row sp"><h1>Trips</h1><button class="sm" data-act="newtrip">New trip</button></div><h2>Active</h2>${a.map(r).join('')||'<p class="muted">No active trips.</p>'}<h2>Completed</h2>${d.map(r).join('')||'<p class="muted">Completed trips appear here.</p>'}${S.trips.length>1?`<h2>Compare trips</h2><div class="card">${bars(S.trips.map(t=>({k:t.name,v:sum(tx(t.id))})))}</div>`:''}`}
function reports(){return`<h1>Reports</h1><p class="muted">Open a trip's report, then print or save it as PDF.</p>${S.trips.map(t=>`<div class="card row sp"><div class="grow"><b>${esc(t.name)}</b><div class="muted">${inr(sum(tx(t.id)))} · ${t.done?'Completed':'Active'}</div></div><button class="sm" data-act="rep" data-id="${t.id}">Open</button></div>`).join('')||'<p class="muted">Create a trip to generate a report.</p>'}<h2>Settings</h2><div class="card"><div class="row"><button class="grow" data-act="bk">Back up data</button><button class="ghost grow" data-act="rs">Restore</button></div><p class="muted">A backup saves all trips and receipts in one file. Keep it in Files or send it to yourself, and restore it here if data is lost.</p><input type="file" accept=".json,application/json" id="rf" hidden></div><div class="card" style="border-color:var(--danger);margin-top:18px"><b style="color:var(--danger)">Delete data</b><p class="muted">Permanently removes all trips, expenses and receipts from this device. Needs a PIN. Theme settings are kept.</p><button class="dng" style="border:1px solid var(--danger);width:100%" data-act="wipe">Delete data</button></div>`}
function profile(){const p=S.profile,f=(k,l)=>`<label>${l}</label><input data-p="${k}" value="${esc(p[k])}">`;
return`<h1>Profile</h1><div class="card">${f('name','Name')}${f('company','Company (optional)')}${f('empId','Employee ID (optional)')}${f('dept','Department (optional)')}</div>
<h2>Theme</h2><div class="chips">${['auto','light','dark'].map(x=>`<button class="chip ${S.theme===x?'on':''}" data-theme="${x}">${x==='auto'?'Match device':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>
<h2>Backup</h2><div class="card"><div class="row"><button class="grow" data-act="bk">Back up data</button><button class="ghost grow" data-act="rs">Restore</button></div><p class="muted">A backup saves all trips and receipts in one file. Save it to Files or send it to yourself, then restore it here if data is lost.</p><input type="file" accept=".json,application/json" id="rf" hidden></div>`}
function tripPage(t){let l=tx(t.id).filter(e=>(flt.mode==='All'||e.mode===flt.mode)&&(!flt.date||new Date(e.at).toISOString().slice(0,10)===flt.date)&&(!flt.q||e.desc.toLowerCase().includes(flt.q.toLowerCase()))).sort((a,b)=>b.at-a.at);
return`<div class="row"><button class="ghost sm" data-act="back">Back</button><h1 class="grow">${esc(t.name)}</h1></div><div class="muted">${esc(t.loc)} · ${esc(t.client||'')} ${esc(t.notes||'')}</div><div class="hero" style="margin-top:12px"><div class="big">${inr(sum(tx(t.id)))}</div></div>
<div class="row" style="margin-bottom:10px"><button data-act="rep" data-id="${t.id}" class="grow">Report</button><button class="ghost grow" data-act="${t.done?'reopen':'finish'}" data-id="${t.id}">${t.done?'Reopen trip':'Complete trip'}</button></div>
<input placeholder="Search description" value="${esc(flt.q)}" data-f="q"><div class="chips" style="margin:10px 0">${['All',...MODES].map(m=>`<button class="chip ${flt.mode===m?'on':''}" data-mode="${m}">${m}</button>`).join('')}</div><input type="date" value="${flt.date}" data-f="date" aria-label="Filter by date">
<h2>${l.length} expense${l.length==1?'':'s'} · ${inr(sum(l))}</h2>${l.map(e=>expRow(e,1)).join('')||'<p class="muted">No expenses match.</p>'}`}
function render(){theme();const a=$('#app'),fy=document.activeElement;let h;
if(view&&view.t)h=tripPage(S.trips.find(x=>x.id===view.t)||{});else h={home,trips,reports,profile}[tab]();
a.innerHTML=h+(active()?'<button class="fab" data-act="addx" aria-label="Add expense">+</button>':'')+`<nav><div class="in">${[['home','Home','home'],['trips','Trips','trips'],['reports','Reports','rep']].map(([k,l,i])=>`<button class="${tab===k&&!view?'on':''}" data-tab="${k}">${ico(IC[i])}${l}</button>`).join('')}</div></nav>`;}
function sheet(h){const d=document.createElement('div');d.className='sheet';d.innerHTML='<div>'+h+'</div>';d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d);return d}
function expForm(id){const e=S.exp.find(x=>x.id===id)||{mode:'UPI',at:Date.now(),imgs:[]},imgs=[...(e.imgs||[])],tz=new Date(e.at-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const d=sheet(`<h2 style="margin-top:0">${id?'Edit':'Add'} expense</h2><label>Amount (₹)</label><input id="a" type="number" inputmode="decimal" value="${e.amt||''}" style="font-size:28px;font-weight:700"><label>What was it for?</label><input id="d" list="ds" value="${esc(e.desc||'')}" placeholder="Coffee, Taxi, Lunch…"><datalist id="ds"><option>Coffee<option>Lunch<option>Taxi<option>Hotel<option>Fuel<option>Parking</datalist>
<label>Payment mode</label><div class="chips" id="ms">${MODES.map(m=>`<button type="button" class="chip ${e.mode===m?'on':''}" data-m="${m}">${m}</button>`).join('')}</div>
<div id="bk" hidden><label>Bank name</label><select id="b"><option value="">Select bank</option>${BANKS.map(b=>`<option>${b}</option>`).join('')}</select><input id="bo" hidden placeholder="Type bank name" style="margin-top:8px"></div><label>Date and time</label><input id="t" type="datetime-local" value="${tz}"><label>Location</label><input id="l" value="${esc(e.loc||'')}"><label>Payment screenshot or receipt</label><div class="row"><button type="button" class="ghost grow" id="cam">Take photo</button><button type="button" class="ghost grow" id="gal">From gallery</button></div><input id="fc" type="file" accept="image/*" capture="environment" hidden><input id="fg" type="file" accept="image/*" multiple hidden><div class="thumbs" id="th"></div>
<label>Notes (optional)</label><textarea id="n" rows="2">${esc(e.note||'')}</textarea><div class="row" style="margin-top:16px"><button class="ghost grow" id="x">Cancel</button><button class="grow" id="s">Save expense</button></div>`);
let mode=e.mode;const th=()=>{d.querySelector('#th').innerHTML=imgs.map((s,i)=>`<img src="${s}" data-rm="${i}" alt="Receipt" title="Tap to remove">`).join('')};th();
const bs=d.querySelector('#b'),bo=d.querySelector('#bo'),sync=()=>{d.querySelector('#bk').hidden=!(mode==='Debit Card'||mode==='Credit Card');bo.hidden=bs.value!=='Other'};if(e.bank){if(BANKS.includes(e.bank))bs.value=e.bank;else{bs.value='Other';bo.value=e.bank}}bs.onchange=sync;sync();
d.querySelector('#ms').onclick=ev=>{const m=ev.target.dataset.m;if(!m)return;mode=m;d.querySelectorAll('#ms .chip').forEach(c=>c.classList.toggle('on',c.dataset.m===m));sync()};
d.querySelector('#th').onclick=ev=>{const i=ev.target.dataset.rm;if(i!==undefined){imgs.splice(+i,1);th()}};
d.querySelector('#cam').onclick=()=>d.querySelector('#fc').click();d.querySelector('#gal').onclick=()=>d.querySelector('#fg').click();
const add=async fs=>{for(const f of fs){imgs.push(await shrink(f))}th()};d.querySelector('#fc').onchange=ev=>add(ev.target.files);d.querySelector('#fg').onchange=ev=>add(ev.target.files);
d.querySelector('#x').onclick=()=>d.remove();
d.querySelector('#s').onclick=()=>{const amt=parseFloat(d.querySelector('#a').value),desc=d.querySelector('#d').value.trim();if(!(amt>0)||!desc){note('Enter an amount and a description.');return}
let bank='';if(mode==='Debit Card'||mode==='Credit Card'){bank=bs.value==='Other'?bo.value.trim():bs.value;if(!bank){note('Select or type the bank name.');return}}
const r={id:e.id||uid(),trip:e.trip||active().id,amt,desc,mode,bank,at:new Date(d.querySelector('#t').value).getTime()||Date.now(),loc:d.querySelector('#l').value,note:d.querySelector('#n').value,imgs};
if(id)S.exp[S.exp.findIndex(x=>x.id===id)]=r;else S.exp.push(r);save();d.remove();render()};
setTimeout(()=>d.querySelector('#a').focus(),50)}
function shrink(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};i.onerror=()=>res(r.result);i.src=r.result};r.readAsDataURL(f)})}
function tripForm(){const d=sheet(`<h2 style="margin-top:0">New trip</h2><label>Trip name or purpose</label><input id="n"><label>Visit location</label><input id="l"><div class="grid"><div><label>Start date</label><input id="s" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>End date</label><input id="e" type="date"></div></div><label>Client or company (optional)</label><input id="c"><label>Notes</label><textarea id="o" rows="2"></textarea><div class="row" style="margin-top:16px"><button class="ghost grow" id="x">Cancel</button><button class="grow" id="k">Create trip</button></div>`);
d.querySelector('#x').onclick=()=>d.remove();d.querySelector('#k').onclick=()=>{const name=d.querySelector('#n').value.trim();if(!name){note('Give the trip a name.');return}const t={id:uid(),name,loc:d.querySelector('#l').value,s:d.querySelector('#s').value,e:d.querySelector('#e').value,client:d.querySelector('#c').value,notes:d.querySelector('#o').value,done:false};S.trips.push(t);S.tripId=t.id;save();d.remove();render()}}
function report(id){const t=S.trips.find(x=>x.id===id),l=tx(id).sort((a,b)=>a.at-b.at),p=S.profile,m=bymode(l);
const d=sheet(`<div class="row noprint" style="margin-bottom:10px;flex-wrap:wrap"><button id="pr">Save PDF</button><button class="ghost" id="cp">Copy for Excel</button><button class="ghost" id="dl">Download CSV</button><button class="ghost" id="sh">Share</button><button class="ghost" id="x">Close</button></div><div class="rep" id="rep"><h2 style="margin-top:0">Expense report</h2><table><tr><td>Employee</td><td>${esc(p.name)} ${p.empId?'('+esc(p.empId)+')':''}</td></tr><tr><td>Company / Dept</td><td>${esc(p.company)} ${esc(p.dept)}</td></tr><tr><td>Trip</td><td>${esc(t.name)}</td></tr><tr><td>Location</td><td>${esc(t.loc)}</td></tr><tr><td>Dates</td><td>${t.s||''} to ${t.e||''}</td></tr></table>
<h2>Transactions</h2><table><tr><th>#</th><th>Date</th><th>Description</th><th>Mode</th><th class="r">Amount</th></tr>${l.map((e,i)=>`<tr><td>${i+1}</td><td>${new Date(e.at).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(e.desc)}${e.imgs?.length?' ('+e.imgs.length+' receipt'+(e.imgs.length>1?'s':'')+')':''}</td><td>${e.mode}${e.bank?' ('+esc(e.bank)+')':''}</td><td class="r">${inr(e.amt)}</td></tr>`).join('')}</table>
<h2>Summary</h2><table>${m.map(x=>`<tr><td>Total ${x.k}</td><td class="r">${inr(x.v)}</td></tr>`).join('')}<tr><th>Overall trip expenditure</th><th class="r">${inr(sum(l))}</th></tr></table>
${l.some(e=>e.imgs?.length)?'<h2>Receipts</h2>'+l.map((e,i)=>e.imgs?.length?`<div style="break-inside:avoid"><b>#${i+1} ${esc(e.desc)} ${inr(e.amt)}</b><br>${e.imgs.map(s=>`<img src="${s}" alt="Receipt">`).join('')}</div>`:'').join(''):''}</div>`);
d.id='rep';d.querySelector('#x').onclick=()=>d.remove();d.querySelector('#pr').onclick=()=>makePDF(t,l,m);
const csv=['#\tDate\tDescription\tMode\tAmount',...l.map((e,i)=>[i+1,new Date(e.at).toLocaleString('en-IN'),e.desc,e.mode+(e.bank?' ('+e.bank+')':''),e.amt].join('\t')),'\t\t\tTotal\t'+sum(l)].join('\n');
d.querySelector('#cp').onclick=()=>copyText(csv,'Table for Excel');d.querySelector('#dl').onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const rows=[['#','Date','Description','Mode','Amount'],...l.map((e,i)=>[i+1,new Date(e.at).toLocaleString('en-IN'),e.desc,e.mode+(e.bank?' ('+e.bank+')':''),e.amt]),['','','','Total',sum(l)]].map(r=>r.map(q).join(',')).join('\n');if(getFile((t.name||'trip').replace(/\W+/g,'-')+'.csv',rows,'text/csv'))note('CSV saved');else showText('Table',csv)};
d.querySelector('#sh').onclick=async()=>{const txt=`${t.name} (${t.loc})\nTotal: ${inr(sum(l))}\n`+m.filter(x=>x.v).map(x=>x.k+': '+inr(x.v)).join('\n');if(navigator.share){try{await navigator.share({title:'Expense report',text:txt})}catch(e){if(e.name!=='AbortError')copyText(txt,'Summary')}}else copyText(txt,'Summary')}}
document.addEventListener('click',e=>{const g=e.target.closest('[data-act],[data-tab],[data-theme],[data-mode],img[data-e]');if(!g)return;const D=g.dataset;
if(D.tab){tab=D.tab;view=null;render();return}if(D.theme){S.theme=D.theme;save();render();return}if(D.mode){flt.mode=D.mode;render();return}
if(g.tagName==='IMG'&&D.e){const x=S.exp.find(q=>q.id===D.e);const d=sheet(`<button id="cl" style="width:100%;margin-bottom:10px">Close</button><img src="${x.imgs[D.i]}" style="width:100%;border-radius:12px" alt="Original receipt">`);d.querySelector('#cl').onclick=()=>d.remove();return}
const a=D.act;if(a==='addx')expForm();else if(a==='editx')expForm(D.id);else if(a==='newtrip')tripForm();else if(a==='open'){view={t:D.id};flt={mode:'All',q:'',date:''};render()}else if(a==='back'){view=null;render()}
else if(a==='rep')report(D.id);else if(a==='delx'){ask('Delete this expense?',()=>{S.exp=S.exp.filter(x=>x.id!==D.id);save();render()})}else if(a==='bk')backup();else if(a==='wipe')wipe();else if(a==='rs')$('#rf').click();
else if(a==='finish'||a==='reopen'){const t=S.trips.find(x=>x.id===D.id);t.done=a==='finish';if(!t.done)S.tripId=t.id;save();render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.p){S.profile[t.dataset.p]=t.value;save()}if(t.dataset.f){flt[t.dataset.f]=t.value;const p=t.selectionStart;render();const n=document.querySelector(`[data-f="${t.dataset.f}"]`);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}}});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.pic!==undefined&&t.files[0]){S.profile.pic=await shrink(t.files[0]);save();render()}if(t.id==='rf'&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!Array.isArray(j.trips)||!Array.isArray(j.exp))throw 0;ask('Replace the data on this device with this backup?',()=>{S=Object.assign({trips:[],exp:[],profile:{},theme:'auto',tripId:null},j);save();render();note('Backup restored')})}catch(x){note('That file is not a TripLedger backup.')}t.value=''}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
(function(){const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0f766e';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.font='700 110px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('₹',90,95);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)})();
render();
</script></body></html>
